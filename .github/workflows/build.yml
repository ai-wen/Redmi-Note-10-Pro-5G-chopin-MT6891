# =============================================================================
# Linux ROM CI — Redmi Note 10 Pro 5G（chopin / MT6891）· denial 桌面
#
# 独立 CI/CD 项目：本仓库只承载 workflow 与文档，所有源码运行时自动拉取。
#
# 流程（与仓库根 build.md 对应）：
#   MT6891 主线内核（7.3.3）经 actions/cache 恢复（未命中才 clone 并保存）
#   → GCC 交叉编译（无 Clang）
#   → Arch Linux ARM aarch64 rootfs → 官方 aarch64 仓安装 denial 二进制包
#   → modules_install → busybox initramfs → mkbootimg 打 boot.img
#   → ext4 打 linux-rootfs.img → 上传 artifact
#
# 常量直接改下方 env 区（无 inputs）：
#   KERNEL_REPO / KERNEL_REF   内核源码（MT6891-Mainline）。源码走 cache：
#                              默认复用最近一次保存的缓存（不查上游）；
#                              手动触发勾选 update_cache 才检查上游新提交并
#                              重新拉取保存（缓存 key = 该 commit SHA）。
#                              缓存只含源码（save 在 clone 后、编译产出 out/ 之前）
#   MAKE_JOBS                  '1' = 单线程前台编译；超时再调大
#   ROOTFS_SIZE                rootfs 镜像大小（注意 runner 磁盘余量）
#   ROOT_PW（脚本内）          rootfs root 密码（SSH 救援用）
#
# 注意事项：
#   1. denial 走官方 aarch64 Pacman 二进制仓（packages.denialwm.org，随
#      pacman 自动拉取）。源码交叉编译 denial 需自建 ARM64 Flutter/Skia
#      引擎，远超托管 runner 单 job 6 小时上限，不在 CI 实现。
#      install.sh 要求交互终端（/dev/tty），此处按其 pacman 通道等价复刻，
#      签名密钥指纹与 install.sh 一致。
#   2. mkbootimg 分区参数使用默认值。**首刷前务必按内核移植仓库说明核对
#      base / kernel_offset / pagesize / header_version，参数错误可能变砖。**
#      （本内核 CONFIG_CMDLINE_FORCE=y，cmdline 已固化，--cmdline 无需填写）
#   3. 单线程内核编译约 1–2.5h；单 job 上限 6h（timeout-minutes: 350）。
#   4. artifact 建议公共仓库运行（免费）；私有仓库注意存储配额。
#   5. smoke_test 勾选后跳过内核编译与模块安装，用占位内核产物快速验证
#      rootfs/denial 安装与打包全流程（artifact 带 -SMOKETEST 后缀，不可刷机）。
#   6. 产物缓存（默认全部复用；勾选 force_rebuild 全部忽略并重编）：
#      - 内核构建 out/ ：key = defconfig + 内核 commit SHA（换源自动重编）
#      - 配置好的 rootfs（含 denial）：key = ROOTFS_CACHE_VER + 本 workflow
#        文件哈希（chroot 脚本一改即自动失效）；想刷新系统包把 VER 手动 +1
#      - 内核源码缓存仍由 update_cache 单独控制
# =============================================================================

name: Linux ROM CI (chopin MT6891, denial desktop)

on:
  workflow_dispatch:
    inputs:
      update_cache:
        description: '更新内核源码缓存：检查上游新提交并重新拉取保存。默认关闭，直接复用现有缓存（无缓存时首次运行仍会拉取并缓存）'
        required: false
        type: boolean
        default: false
      smoke_test:
        description: '快速验证后续流程：跳过内核编译与模块安装，用占位内核产物走完 rootfs/denial/打包全流程（产物不可刷机）'
        required: false
        type: boolean
        default: false
      force_rebuild:
        description: '强制重新编译：忽略内核构建与 rootfs 产物缓存，全部重新执行并保存新缓存'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Linux ROM (kernel + denial rootfs + images)
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      # ---- 源码（每次运行全新拉取）----
      KERNEL_REPO: https://github.com/MT6891-Mainline/linux.git
      KERNEL_REF: "7.3.3-mt6893-xiaomi-chopin"
      KERNEL_SRC: ${{ github.workspace }}/rom/kernel
      DEFCONFIG: chopin_defconfig
      DTB_PATTERN: "*chopin*.dtb"
      BUSYBOX_VER: "1.38.0"
      # rootfs 缓存版本号：chroot 脚本不变但想刷新滚动系统包时手动 +1
      ROOTFS_CACHE_VER: "1"
      # ---- 构建约定 ----
      MAKE_JOBS: "5" # 1 = 单线程；如内核编译超时可调大
      ROOTFS_SIZE: 6G
      ROM_DIR: ${{ github.workspace }}/rom
      ROOTFS_DIR: ${{ github.workspace }}/rom/rootfs

    steps:
      # ---------------------------------------------------------------------
      # checkout：仓库极小、秒级完成，仅为 hashFiles 计算 rootfs 缓存键
      # ---------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------------
      # 构建机依赖（GCC 交叉工具链 + QEMU 用户态 + 打包工具）
      # ---------------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget zip unzip \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            python3 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-user-static cpio e2fsprogs xz-utils kmod
          # mkbootimg 获取（两个来源均不可用的教训）：
          #   - PyPI 无 mkbootimg 包（pip3 install 报 No matching distribution）
          #   - Ubuntu universe 的 mkbootimg（android-platform-tools 34.0.4）打包缺失
          #     gki 模块，运行即 ModuleNotFoundError: No module named 'gki'
          #   → 改用 AOSP 官方脚本（固定 tag android-14.0.0_r1，内容不可变；
          #     支持 --header_version 0-4 与 --dtb）。删除其中唯一的非标准库
          #     import（gki 证书生成，仅服务于 --gki_signing_* GKI 签名，
          #     本流程不使用该代码路径）
          curl -fL --retry 3 \
            "https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/tags/android-14.0.0_r1/mkbootimg.py?format=TEXT" \
            | base64 -d > "$RUNNER_TEMP/mkbootimg"
          sed -i '/^from gki\.generate_gki_certificate import/d' "$RUNNER_TEMP/mkbootimg"
          if grep -q '^from gki' "$RUNNER_TEMP/mkbootimg"; then
            echo "ERROR: gki import still present" >&2; exit 1
          fi
          head -n1 "$RUNNER_TEMP/mkbootimg"   # 期望: #!/usr/bin/env python3
          sudo install -m 0755 "$RUNNER_TEMP/mkbootimg" /usr/local/bin/mkbootimg
          command -v mkbootimg
          mkbootimg --help >/dev/null
          df -h /

      # ---------------------------------------------------------------------
      # 阶段 1a：内核源码缓存
      #   默认（update_cache=false）：复用最近一次保存的缓存，不查上游
      #   勾选 update_cache：查上游分支 HEAD，SHA 未缓存则重新 clone 并保存
      #   缓存只含源码：save 紧跟 clone，先于编译产出 out/
      # ---------------------------------------------------------------------
      - name: Resolve upstream kernel commit (update mode only)
        if: inputs.update_cache == true
        id: kernel_head
        run: |
          set -euo pipefail
          SHA="$(git ls-remote "$KERNEL_REPO" "refs/heads/$KERNEL_REF" | cut -f1)"
          test -n "$SHA" || { echo "failed to resolve $KERNEL_REPO @ $KERNEL_REF" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "kernel upstream: $KERNEL_REF @ $SHA"

      - name: Restore kernel source from cache
        id: kernel_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.KERNEL_SRC }}
          # update 模式：主键 = 上游 SHA，精确命中直接复用；
          # 默认模式：kernel_head 未运行，主键为 kernel-src-（恒不命中），
          #           由 restore-keys 前缀取最近一次保存的 kernel-src-<SHA>
          key: kernel-src-${{ steps.kernel_head.outputs.sha }}
          restore-keys: |
            kernel-src-

      - name: Prepare kernel source (reuse cache or clone)
        id: kernel_src
        env:
          UPDATE: ${{ inputs.update_cache }}
          CACHE_HIT: ${{ steps.kernel_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [ "$UPDATE" = "true" ] || UPDATE=false

          ACTION=reuse
          if [ "$UPDATE" = "true" ]; then
            if [ "$CACHE_HIT" != "true" ]; then
              echo "update 模式：上游有新提交（或该 SHA 未缓存），重新 clone"
              ACTION=clone
            fi
          else
            if [ ! -d "$KERNEL_SRC/.git" ]; then
              echo "默认模式：无可用缓存（首次运行），clone 并入缓存"
              ACTION=clone
            fi
          fi

          if [ "$ACTION" = "clone" ]; then
            rm -rf "$KERNEL_SRC"     # 清掉 restore 取回的旧版本（如有）
            mkdir -p "$ROM_DIR"
            git clone --depth 1 -b "$KERNEL_REF" "$KERNEL_REPO" "$KERNEL_SRC"
            echo "cloned=true" >> "$GITHUB_OUTPUT"
          fi

          SHA_NOW="$(git -C "$KERNEL_SRC" rev-parse HEAD)"
          echo "sha=$SHA_NOW" >> "$GITHUB_OUTPUT"
          echo "kernel build tree: $KERNEL_REF @ $SHA_NOW"
          git -C "$KERNEL_SRC" log --oneline -1

      - name: Save kernel source to cache (only after fresh clone)
        if: steps.kernel_src.outputs.cloned == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KERNEL_SRC }}
          key: kernel-src-${{ steps.kernel_src.outputs.sha }}

      # ---------------------------------------------------------------------
      # 阶段 1b：内核构建缓存（key = defconfig + 源码 SHA，命中即免编译）
      # ---------------------------------------------------------------------
      - name: Restore kernel build cache
        id: kbuild_cache
        if: inputs.force_rebuild != true && inputs.smoke_test != true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.KERNEL_SRC }}/out
          key: kbuild-${{ env.DEFCONFIG }}-${{ steps.kernel_src.outputs.sha }}

      - name: Build kernel
        if: inputs.smoke_test != true && (inputs.force_rebuild == true || steps.kbuild_cache.outputs.cache-hit != 'true')
        run: |
          set -euo pipefail
          cd "$KERNEL_SRC"
          make O=out ARCH=arm64 "$DEFCONFIG"
          make -j"$MAKE_JOBS" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

          KREL="$(cat out/include/config/kernel.release)"
          echo "Kernel release: $KREL"

          IMG=""
          for cand in Image.gz Image; do
            [ -f "out/arch/arm64/boot/$cand" ] && IMG="$PWD/out/arch/arm64/boot/$cand" && break
          done
          test -n "$IMG" || { echo "kernel image not found in out/arch/arm64/boot/" >&2; exit 1; }

          # find 搜索根必须用绝对路径：相对根返回相对路径，后续步骤
          # （CWD 是 workspace 而非内核目录）会解析失败
          DTB="$(find "$PWD/out/arch/arm64/boot/dts" -name "$DTB_PATTERN" -type f | head -n1)"
          test -n "$DTB" || { echo "dtb matching '$DTB_PATTERN' not found" >&2; exit 1; }
          case "$DTB" in /*) ;; *) echo "dtb path not absolute: $DTB" >&2; exit 1;; esac

          echo "KERNEL_REL=$KREL"      >> "$GITHUB_ENV"
          echo "KERNEL_IMG=$IMG"       >> "$GITHUB_ENV"
          echo "KERNEL_DTB=$DTB"       >> "$GITHUB_ENV"
          ls -lh "$IMG" "$DTB"

      - name: Reuse cached kernel build
        if: inputs.smoke_test != true && inputs.force_rebuild != true && steps.kbuild_cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          cd "$KERNEL_SRC"
          KREL="$(cat out/include/config/kernel.release)"
          IMG=""
          for cand in Image.gz Image; do
            [ -f "out/arch/arm64/boot/$cand" ] && IMG="$PWD/out/arch/arm64/boot/$cand" && break
          done
          test -n "$IMG" || { echo "cached kernel build incomplete (no image); rerun with force_rebuild" >&2; exit 1; }
          DTB="$(find "$PWD/out/arch/arm64/boot/dts" -name "$DTB_PATTERN" -type f | head -n1)"
          test -n "$DTB" || { echo "cached kernel build incomplete (no dtb); rerun with force_rebuild" >&2; exit 1; }
          case "$DTB" in /*) ;; *) echo "dtb path not absolute: $DTB" >&2; exit 1;; esac
          echo "KERNEL_REL=$KREL" >> "$GITHUB_ENV"
          echo "KERNEL_IMG=$IMG"  >> "$GITHUB_ENV"
          echo "KERNEL_DTB=$DTB"  >> "$GITHUB_ENV"
          echo "reusing cached kernel build: $KREL"
          ls -lh "$IMG" "$DTB"

      - name: Save kernel build cache
        if: inputs.smoke_test != true && (inputs.force_rebuild == true || steps.kbuild_cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KERNEL_SRC }}/out
          key: kbuild-${{ env.DEFCONFIG }}-${{ steps.kernel_src.outputs.sha }}
        # 同 key 已存在时 save 会报错（缓存不可变）；force_rebuild 同 SHA
        # 重编场景属预期，吞掉该错误。想替换缓存：源码换 SHA 或删 UI 缓存
        continue-on-error: true

      # ---------------------------------------------------------------------
      # 阶段 1c（smoke test）：占位内核产物，跳过编译仅验证后续流程
      # ---------------------------------------------------------------------
      - name: Fabricate placeholder kernel artifacts (smoke test)
        if: inputs.smoke_test == true
        run: |
          set -euo pipefail
          cd "$KERNEL_SRC"
          mkdir -p out/arch/arm64/boot/dts/mediatek out/include/config
          head -c 8192 /dev/urandom | gzip -1 > out/arch/arm64/boot/Image.gz
          head -c 2048  /dev/urandom > out/arch/arm64/boot/dts/mediatek/mt6893-xiaomi-chopin.dtb
          printf '0.0.0-smoketest\n' > out/include/config/kernel.release
          echo "KERNEL_REL=0.0.0-smoketest" >> "$GITHUB_ENV"
          echo "KERNEL_IMG=$PWD/out/arch/arm64/boot/Image.gz" >> "$GITHUB_ENV"
          echo "KERNEL_DTB=$PWD/out/arch/arm64/boot/dts/mediatek/mt6893-xiaomi-chopin.dtb" >> "$GITHUB_ENV"
          # 注意：GITHUB_ENV 对后续步骤生效，本步骤内不能用 $KERNEL_IMG（set -u 会报未绑定）
          ls -lh out/arch/arm64/boot/Image.gz \
                 out/arch/arm64/boot/dts/mediatek/mt6893-xiaomi-chopin.dtb

      # ---------------------------------------------------------------------
      # 阶段 2a：rootfs 缓存 / Arch Linux ARM aarch64 rootfs + QEMU binfmt
      # 缓存 key 含 ROOTFS_CACHE_VER 与本 workflow 文件哈希：
      # chroot 脚本改动自动失效；刷新滚动系统包手动 +1 VER
      # ---------------------------------------------------------------------
      - name: Restore configured rootfs cache
        id: rootfs_cache
        if: inputs.force_rebuild != true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ROOTFS_DIR }}
          key: rootfs-v${{ env.ROOTFS_CACHE_VER }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Prepare Arch Linux ARM rootfs
        if: inputs.force_rebuild == true || steps.rootfs_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$ROOTFS_DIR"
          cd "$ROM_DIR"
          wget -q --show-progress \
            http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          # --warning=no-unknown-keyword：ALARM tarball 由 libarchive 制作，
          # 其 pax 扩展头（文件 capabilities）GNU tar 不识别，消除警告噪音
          sudo tar --warning=no-unknown-keyword \
            -xzf ArchLinuxARM-aarch64-latest.tar.gz -C "$ROOTFS_DIR"
          sudo cp /usr/bin/qemu-aarch64-static "$ROOTFS_DIR/usr/bin/"
          # runner 的 resolv.conf 指向 systemd-resolved 桩(127.0.0.53)，
          # qemu-user chroot 内解析失败（Could not resolve host）→ 写公共 DNS
          # （proot-distro 的 archlinux 构建同款做法；镜像内残留由
          #   chroot 后清理步骤统一改回 1.1.1.1）
          sudo rm -f "$ROOTFS_DIR/etc/resolv.conf"
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' \
            | sudo tee "$ROOTFS_DIR/etc/resolv.conf" >/dev/null

          # binfmt 说明：ubuntu-24.04 runner 上安装 qemu-user-static 时由
          # systemd-binfmt 自动注册 binfmt_misc 处理器，无需 update-binfmts
          # （该命令属 binfmt-support 包，--no-install-recommends 下不存在）。
          # 此处硬校验 ARM64 二进制确实可执行：
          test "$(sudo chroot "$ROOTFS_DIR" /bin/uname -m)" = "aarch64"

      # ---------------------------------------------------------------------
      # 阶段 2b：chroot 内配置系统 + 安装 denial（官方 aarch64 Pacman 仓）
      # ---------------------------------------------------------------------
      - name: Configure rootfs and install denial (chroot)
        if: inputs.force_rebuild == true || steps.rootfs_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mount --bind /proc     "$ROOTFS_DIR/proc"
          sudo mount --bind /sys      "$ROOTFS_DIR/sys"
          sudo mount --bind /dev      "$ROOTFS_DIR/dev"
          sudo mount --bind /dev/pts  "$ROOTFS_DIR/dev/pts"

          # ---- 镜像健康检查（host 侧执行；rootfs 里此时未必有 curl）----
          # 背景：GeoIP 主镜像把不同客户端定向到状态不一的后端，DB 引用的
          # 包版本可能不在包池（实测 DB=-2/池=-3 → 404，且随时间漂移）。
          # 逐镜像校验"其 extra.db 引用的 mesa 版本在自己包池确实存在"，
          # 只把一致者写入 mirrorlist；全不一致则退回全列表（不比现状差）。
          CANDIDATES="
            http://mirror.archlinuxarm.org
            http://de.mirror.archlinuxarm.org
            http://mirror.csclub.uwaterloo.ca/archlinuxarm
            http://mirrors.dotsrc.org/archlinuxarm"
          HEALTHY=""
          for base in $CANDIDATES; do
            fn="$(curl -fsSL --max-time 90 "$base/aarch64/extra/extra.db" -o /tmp/extra.db \
                  && tar -xaf /tmp/extra.db -O 'mesa-*/desc' 2>/dev/null \
                  | awk '/^%FILENAME%$/{getline; print; exit}' || true)"
            if [ -n "$fn" ] && curl -fsI --max-time 30 "$base/aarch64/extra/$fn" -o /dev/null; then
              HEALTHY="$HEALTHY $base"
              echo "mirror OK:  $base (mesa $fn)"
            else
              echo "mirror BAD: $base (db file: ${fn:-none})" >&2
            fi
          done
          if [ -z "$HEALTHY" ]; then
            echo "WARNING: no self-consistent mirror found; using full list" >&2
            HEALTHY="$CANDIDATES"
          fi
          sudo rm -f "$ROOTFS_DIR/etc/pacman.d/mirrorlist"
          for b in $HEALTHY; do
            echo "Server = $b/\$arch/\$repo" | sudo tee -a "$ROOTFS_DIR/etc/pacman.d/mirrorlist" >/dev/null
          done
          cat "$ROOTFS_DIR/etc/pacman.d/mirrorlist"

          sudo chroot "$ROOTFS_DIR" /bin/bash -s <<'CHROOT_EOF'
          set -euo pipefail
          ROOT_PW='chopin'

          # --- qemu-user 下 pacman 的两处不兼容 ---
          # 1) pacman 7.x 下载沙箱（landlock + alpm 用户）在 qemu-user 下不可用：
          #    官方对策 DisableSandbox（man pacman.conf(5)；proot-distro 的
          #    archlinux 构建脚本同款修复）
          # 2) CheckSpace 磁盘空间检查需把 cachedir 的 st_dev 与
          #    /proc/self/mounts 匹配出挂载点，qemu-user 的 statvfs 值对不上 →
          #    "could not determine cachedir mount point" +
          #    "not enough free disk space" 误报；runner 磁盘充足，直接关闭
          sed -i 's/^#DisableSandbox/DisableSandbox/' /etc/pacman.conf
          grep -q '^DisableSandbox' /etc/pacman.conf \
            || sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          sed -i 's/^DownloadUser/#DownloadUser/' /etc/pacman.conf
          sed -i 's/^CheckSpace/#CheckSpace/' /etc/pacman.conf

          # mirrorlist 已在 chroot 前由 host 侧健康检查动态生成
          # （筛选 DB 与包池一致的镜像，见上方 "镜像健康检查" 段落）

          # --- 基础系统 ---
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman -Syu --noconfirm \
            || { pacman -Sy --noconfirm archlinuxarm-keyring && pacman -Syu --noconfirm; }

          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "root:${ROOT_PW}" | chpasswd

          # 普通桌面用户 kk（wheel=sudo；audio/video/input/render=声卡/DRM/输入）
          useradd -m -G wheel,audio,video,input,render kk
          echo 'kk:chopin' | chpasswd

          # mesa + vulkan-panfrost：chopin 的 GPU 是 Mali G77，panfrost 是
          # 对应主线驱动。预装可满足 vulkan-driver 虚拟依赖，否则安装 denial
          # 时会弹 13 选 1 的 provider 提示，--noconfirm 默认选 nvidia-utils
          # （对 ARM 手机完全无意义还多占 ~300MB）。带重试防镜像瞬态 404
          ok=0
          for attempt in 1 2 3; do
            if pacman -S --needed --noconfirm \
                 udev networkmanager openssh e2fsprogs sudo curl gnupg greetd \
                 mesa vulkan-panfrost; then ok=1; break; fi
            echo "base install attempt $attempt failed; retry in 60s" >&2
            sleep 60
          done
          [ "$ok" = 1 ] || { echo "base install failed after 3 attempts" >&2; exit 1; }
          systemctl enable NetworkManager sshd || true
          mkdir -p /etc/ssh/sshd_config.d
          echo 'PermitRootLogin yes' > /etc/ssh/sshd_config.d/10-root.conf

          echo 'LABEL=linuxroot  /  ext4  defaults,noatime  0 1' >> /etc/fstab

          # --- denial 官方 aarch64 仓库（等价 install.sh 的 pacman 通道）---
          curl -fLO https://packages.denialwm.org/denial-repo-key.asc
          pacman-key --add denial-repo-key.asc
          pacman-key --lsign-key AE4108FA5E91E26BE0EE331E0F5B3AD16E023091
          rm -f denial-repo-key.asc
          printf '\n[denial]\nSigLevel = Required TrustedOnly\nServer = https://packages.denialwm.org/arch/$arch\n' \
            >> /etc/pacman.conf
          # denial 安装带重试：镜像 push 同步窗口的 404 等待后自愈
          ok=0
          for attempt in 1 2 3; do
            if pacman -Syu --noconfirm denial; then ok=1; break; fi
            echo "denial install attempt $attempt failed; retry in 60s" >&2
            sleep 60
          done
          [ "$ok" = 1 ] || { echo "denial install failed after 3 attempts" >&2; exit 1; }

          # --- 开机自启 denial（greetd initial_session + mobile 外壳）---
          EXEC_LINE=""
          DESKTOP=/usr/share/wayland-sessions/denial.desktop
          if [ -f "$DESKTOP" ]; then
            EXEC_LINE="$(grep -h -m1 '^Exec=' "$DESKTOP" | cut -d= -f2-)"
          fi
          if [ -n "$EXEC_LINE" ]; then
            cat > /usr/local/bin/denial-mobile-session <<WRAP
          #!/bin/sh
          export DENIAL_SHELL_PROFILE=mobile
          exec ${EXEC_LINE}
          WRAP
            chmod +x /usr/local/bin/denial-mobile-session
            printf '[terminal]\nvt = 7\n\n[default_session]\ncommand = "/usr/local/bin/denial-mobile-session"\nuser = "kk"\n' \
              > /etc/greetd/config.toml
            systemctl enable greetd || true
          else
            echo "WARNING: denial.desktop not found; greetd autostart NOT configured" >&2
          fi
          CHROOT_EOF

          # --- 清理 chroot 环境 ---
          # 逐个卸载（先子挂载 dev/pts 再父挂载 dev）：
          #   - 只卸确实挂载着的目标，避免 "not mounted" 噪音（多目标 umount
          #     的部分失败位掩码（如 96=64+32）会误杀整个步骤）
          #   - busy 时逐目标 lazy 卸载兜底
          #   - 最后硬校验：残留挂载会让后续 cp -a 掉进 /proc 等虚拟文件系统
          for m in dev/pts dev proc sys; do
            if mountpoint -q "$ROOTFS_DIR/$m"; then
              sudo umount "$ROOTFS_DIR/$m" || sudo umount -l "$ROOTFS_DIR/$m"
            fi
          done
          for m in dev proc sys; do
            if mountpoint -q "$ROOTFS_DIR/$m"; then
              echo "ERROR: $ROOTFS_DIR/$m still mounted after cleanup" >&2
              exit 1
            fi
          done
          sudo rm -f "$ROOTFS_DIR/usr/bin/qemu-aarch64-static"
          echo 'nameserver 1.1.1.1' | sudo tee "$ROOTFS_DIR/etc/resolv.conf" >/dev/null

      - name: Save configured rootfs cache
        if: inputs.force_rebuild == true || steps.rootfs_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ROOTFS_DIR }}
          key: rootfs-v${{ env.ROOTFS_CACHE_VER }}-${{ hashFiles('.github/workflows/build.yml') }}
        # 同 key 已存在时 save 报错（缓存不可变）；刷新系统包请先 VER+1
        continue-on-error: true

      # ---------------------------------------------------------------------
      # 阶段 3：内核模块并入 rootfs（版本必须与内核镜像一致）
      # ---------------------------------------------------------------------
      - name: Install kernel modules into rootfs
        if: inputs.smoke_test != true
        run: |
          set -euo pipefail
          cd "$KERNEL_SRC"
          # 清掉缓存 rootfs 里可能残留的旧模块（含 ALARM 通用内核的），
          # 保证镜像只含本次内核的模块
          sudo rm -rf "$ROOTFS_DIR/lib/modules"
          # rootfs 由 sudo tar 解出、整树 root 属主，runner 用户无权写入
          # lib/modules → 以 root 执行 modules_install（产物属主 root，
          # 与最终镜像一致；kmod 包提供 depmod）
          sudo make -j"$MAKE_JOBS" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$ROOTFS_DIR" modules_install
          # build/source 符号链接指向 runner 源码路径，在设备上是死链，移除
          sudo rm -f "$ROOTFS_DIR/lib/modules/$KERNEL_REL/build" \
                    "$ROOTFS_DIR/lib/modules/$KERNEL_REL/source"
          ls "$ROOTFS_DIR/lib/modules/$KERNEL_REL"

      # ---------------------------------------------------------------------
      # 阶段 4：busybox initramfs（blkid 找 LABEL=linuxroot 后 switch_root）
      # ---------------------------------------------------------------------
      - name: Build busybox and pack initramfs
        run: |
          set -euo pipefail
          cd "$ROM_DIR"
          wget -q "https://busybox.net/downloads/busybox-${BUSYBOX_VER}.tar.bz2"
          tar -xjf "busybox-${BUSYBOX_VER}.tar.bz2"
          cd "busybox-${BUSYBOX_VER}"
          make defconfig
          # tc applet 有内核 UAPI 头文件兼容前科（1.36.1 的 CBQ 宏在
          # linux-libc-dev >= 6.8 中被删除 → networking/tc.c 编译失败）；
          # initramfs 只需 sh/mount/blkid/mdev/switch_root，tc 无用，直接禁用
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          # oldconfig 需交互应答，用 yes 灌回车；make 结束后 yes 必收
          # SIGPIPE(141)，而 pipefail 会将其判为整条管道失败 → 此处临时关闭
          set +o pipefail
          yes '' | make oldconfig >/dev/null
          set -o pipefail
          grep -q '^# CONFIG_TC is not set' .config
          make CROSS_COMPILE=aarch64-linux-gnu- LDFLAGS="--static" -j"$MAKE_JOBS"

          # 校验：aarch64 + 静态链接
          file busybox
          file busybox | grep -q 'ARM aarch64'
          file busybox | grep -q 'statically linked'

          make CONFIG_PREFIX="$ROM_DIR/initramfs" install
          cd "$ROM_DIR/initramfs"
          rm -f linuxrc
          mkdir -p newroot dev proc sys

          cat > init <<'INIT_EOF'
          #!/bin/sh
          # cmdline 无 root= 且 CONFIG_CMDLINE_FORCE=y：由 initramfs 定位根分区
          mkdir -p /proc /sys /dev /newroot
          mount -t proc     proc     /proc
          mount -t sysfs    sysfs    /sys
          mount -t devtmpfs devtmpfs /dev
          echo /bin/mdev > /proc/sys/kernel/hotplug 2>/dev/null || true
          mdev -s

          ROOT="$(blkid -L linuxroot)"
          if [ -z "$ROOT" ]; then
              echo "[init] LABEL=linuxroot not found; dropping to shell" >&2
              exec sh
          fi
          mount -o ro "$ROOT" /newroot || exec sh
          exec switch_root /newroot /sbin/init
          INIT_EOF
          chmod +x init

          find . | cpio -o -H newc | gzip -1 > "$ROM_DIR/initramfs.cpio.gz"
          ls -lh "$ROM_DIR/initramfs.cpio.gz"

      # ---------------------------------------------------------------------
      # 阶段 5a：mkbootimg 打 boot.img（分区参数用默认值，见文件头警告）
      # ---------------------------------------------------------------------
      - name: Pack boot.img
        run: |
          set -euo pipefail
          mkbootimg \
            --kernel "$KERNEL_IMG" \
            --dtb    "$KERNEL_DTB" \
            --ramdisk "$ROM_DIR/initramfs.cpio.gz" \
            --header_version 2 \
            --output "$ROM_DIR/boot.img"
          ls -lh "$ROM_DIR/boot.img"

      # ---------------------------------------------------------------------
      # 阶段 5b：ext4 rootfs 镜像（LABEL=linuxroot，与 fstab/initramfs 对应）
      # ---------------------------------------------------------------------
      - name: Pack linux-rootfs.img
        run: |
          set -euo pipefail
          df -h /
          truncate -s "$ROOTFS_SIZE" "$ROM_DIR/linux-rootfs.img"
          mkfs.ext4 -F -L linuxroot "$ROM_DIR/linux-rootfs.img"

          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop "$ROM_DIR/linux-rootfs.img" /mnt/rootfs
          sudo cp -a "$ROOTFS_DIR/." /mnt/rootfs/
          sync
          sudo umount /mnt/rootfs
          ls -lh "$ROM_DIR/linux-rootfs.img"

      # ---------------------------------------------------------------------
      - name: Write flash instructions to job summary
        env:
          KERNEL_SHA: ${{ steps.kernel_src.outputs.sha }}
          SMOKE: ${{ inputs.smoke_test }}
        run: |
          set -euo pipefail
          {
            if [ "$SMOKE" = "true" ]; then
              echo "## WARNING: SMOKE TEST 运行"
              echo "**内核为占位随机数据，本产物不可刷机**（仅用于验证 rootfs/denial/打包流程）"
              echo
            fi
            echo "## Linux ROM（chopin / MT6891 · denial 桌面）"
            echo
            echo "- Kernel release: \`${KERNEL_REL}\`（MT6891-Mainline \`${KERNEL_REF}\` @ \`${KERNEL_SHA:0:12}\`）"
            echo "- 桌面用户: \`kk\` / \`chopin\`（greetd 自动登录进 denial，非 root 运行）"
            echo "- root 密码（SSH 救援用）: \`chopin\`（workflow 内 ROOT_PW）"
            echo "- 串口 console 已固化: \`ttyS0,921600\`（earlycon mtk8250）"
            echo
            echo "### 刷机"
            echo '```bash'
            echo "fastboot flash boot     boot.img"
            echo "fastboot flash userdata linux-rootfs.img   # 清空安卓数据"
            echo "fastboot reboot"
            echo '```'
            echo
            echo "> 刷机前先备份原厂 boot/dtbo/vbmeta；mkbootimg 使用默认分区参数，"
            echo "> 请按内核移植仓库说明核对（build.md §8.1）。"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-rom-chopin-denial${{ inputs.smoke_test == true && '-SMOKETEST' || '' }}
          path: |
            ${{ env.ROM_DIR }}/boot.img
            ${{ env.ROM_DIR }}/initramfs.cpio.gz
            ${{ env.ROM_DIR }}/linux-rootfs.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
